[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "found-in-meta"
version = "0.1.0"
description = "A deterministic document-integrity investigation with source-linked evidence"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
found-in-meta = "found_in_meta.cli:main"

[tool.setuptools.packages.find]
include = ["found_in_meta*"]

[tool.setuptools.package-data]
found_in_meta = ["fixtures/*.json", "fixtures/documents/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
